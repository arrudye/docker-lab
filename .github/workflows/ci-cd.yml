name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOCKER_HUB_REPO: arrrue/library-app
  COVERAGE_THRESHOLD: 50

jobs:
  # 1 - build (проверка сборки приложения)
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: ./app
        run: |
          pip install -r requirements.txt
      
      - name: Check app imports
        working-directory: ./app
        run: python -c "from src.main import app"

  # 2 - lint (проверка линтером)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Run Ruff
        working-directory: ./app
        run: |
          pip install ruff
          ruff check src/ --output-format=github

  # 3 - test+coverage (запускает тесты и рассчитывает coverage)
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: ./app
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests with coverage
        working-directory: ./app
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term --cov-report=xml --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage.xml

  # 4 - docker build (сборка образа)
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          cd app
          docker build -t library-app:${{ github.sha }} .
      
      - name: Test Docker image
        run: |
          docker run --rm library-app:${{ github.sha }} python -c "from src.main import app"

  # 5 - docker push
  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      
      - name: Build and push Docker image
        run: |
          cd app
          docker build -t ${{ env.DOCKER_HUB_REPO }}:${{ github.sha }} .
          docker tag ${{ env.DOCKER_HUB_REPO }}:${{ github.sha }} ${{ env.DOCKER_HUB_REPO }}:latest
          docker push ${{ env.DOCKER_HUB_REPO }}:${{ github.sha }}
          docker push ${{ env.DOCKER_HUB_REPO }}:latest